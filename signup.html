<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recursive Blogs</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.2.0/css/line.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <section class="form__section">
    <div class="container form__section-container">
      <h2>Sign Up</h2>
      <div class="alert__message error">
        <p>This is an error message</p>
      </div>
      <form action="" enctype="multipart/form-data">
         <input type="text" placeholder="First Name">
         <input type="text" placeholder="Last Name">
         <input type="text" placeholder="Username">
         <input type="text" placeholder="Email">
         <input type="text" placeholder="Create Password">
         <input type="text" placeholder="Confirm Password">
         <div class="form__control">
          <label for="avatar">Upload a profile picture</label>
          <input type="file" id="avatar">
         </div>
         <button class="btn" type="submit">Sign Up</button>
         <small>Already have an account? <a href="signin.html">Sign In</a></small>
      </form>
    </div>
  </section>
</body>
